<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"><meta name="theme-color" content="#191a1c"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Los Santos GPS"><link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./icon.png"><link href="https://cdn.jsdelivr.net/npm/maplibre-gl@5.12.0/dist/maplibre-gl.css" rel="stylesheet"><link href="./style.css" rel="stylesheet"><title>Los Santos GPS</title></head><body><div id="map" role="application" aria-label="Gerçek dünya GTA tarzı harita"></div><div class="vignette"></div><header class="top"><div class="brand"><span class="star">★</span><div><b>LOS SANTOS</b><small>REAL WORLD GPS <span class="ver">v0.2</span></small></div></div><button id="mode" class="chip" aria-pressed="false">◈ MİNİMAP</button></header><section class="searchbox"><form id="searchForm"><span class="loupe">⌕</span><input id="query" autocomplete="off" placeholder="Adres veya mekân ara" aria-label="Adres veya mekân ara"><button type="submit" aria-label="Ara">ARA</button></form><div id="results" class="results" hidden></div></section><section class="routepanel" id="routepanel" hidden><div class="routeheading"><b id="destination">HEDEF</b><button id="clearRoute" aria-label="Rotayı sil">✕</button></div><div class="routeinfo"><strong id="distance">—</strong><span id="duration">—</span><span class="modeTag">🚗 ARAÇ</span></div><div id="instruction" class="instruction">Rota hazır.</div><button id="followRoute" class="primary">▶ NAVİGASYONU BAŞLAT</button></section><aside class="tools"><button id="locate" title="Konumumu bul" aria-label="Konumumu bul">◎</button><button id="heading" title="Yöne göre döndür" aria-label="Yöne göre döndür">◢</button><button id="zoomIn" title="Yakınlaştır" aria-label="Yakınlaştır">＋</button><button id="zoomOut" title="Uzaklaştır" aria-label="Uzaklaştır">－</button></aside><footer class="hud"><div class="compass"><span>N</span><span id="speed">0 <small>km/sa</small></span></div><div class="progress"><div class="progressbar"></div><div class="routebar"></div></div><div class="footrow"><span>◈ LS GPS</span><span id="status">HARİTA YÜKLENİYOR</span><span>GPS <i id="gpsDot">●</i></span></div></footer><div id="toast" class="toast" role="status" hidden></div><div class="legal">© OpenStreetMap contributors · OpenFreeMap</div><script>
(function(){
  const libs=['https://cdn.jsdelivr.net/npm/maplibre-gl@5.12.0/dist/maplibre-gl.js','https://unpkg.com/maplibre-gl@5.12.0/dist/maplibre-gl.js'];
  function loadLib(i){
    if(i>=libs.length){document.getElementById('status').textContent='HARİTA MOTORU YÜKLENEMEDİ';return;}
    const s=document.createElement('script');s.src=libs[i];
    s.onload=()=>{const app=document.createElement('script');app.src='./app.js?v=2';app.onerror=()=>document.getElementById('status').textContent='UYGULAMA KODU YÜKLENEMEDİ';document.body.appendChild(app)};
    s.onerror=()=>loadLib(i+1);document.body.appendChild(s);
  }
  loadLib(0);
})();
</script></body></html>
